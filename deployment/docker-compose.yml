# Local development environment for DPDP-COMPASS.
#
# Run every command below from the repository root (not from deployment/)
# so the --env-file flag finds the root .env — Compose otherwise looks for
# .env next to this file, not at the repo root:
#
#   docker compose --env-file .env -f deployment/docker-compose.yml up
#
# Default usage (as above) starts only the supporting infrastructure
# (Redis, MinIO). Run the API
# (`dotnet run`, from src/Backend/DPDP.Api) and the frontend
# (`npm run dev`, from src/Frontend/dpdp-web) natively against it — this
# gives proper hot reload for both, which is what you want day to day.
# This machine already has PostgreSQL running natively; see
# docs/DEVELOPMENT.md and .env.example.
#
# `--profile local-db` additionally starts a containerised PostgreSQL for
# machines that don't already have one.
#
# `--profile full` additionally builds and runs the API and web as
# containers too, for testing the containerised build end to end.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dpdp_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:18-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: dpdp_compass
      POSTGRES_USER: dpdp_compass_app1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpdp_compass_app1 -d dpdp_compass"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: src/Backend/DPDP.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: ${ConnectionStrings__Default:?set ConnectionStrings__Default in .env}
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "5136:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    profiles: ["full"]
    build:
      context: ../src/Frontend/dpdp-web
      args:
        VITE_API_BASE_URL: http://localhost:5136
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  redis-data:
  minio-data:
  postgres-data:
